# Mango default configuration.
# The service requires at least an orchestrator and a worker agent.
# Fill in provider, model, and api_key for each agent below — either
# interactively during `install.sh`, via `mango config agent edit`, or
# by editing this file directly.
#
# All runtime files live under MANGO_DIR (default: ~/.mango).
# Agent definitions: MANGO_DIR/agents/   Skill definitions: MANGO_DIR/skills/

# TCP access is enabled for browser/remote clients by default.
# WARNING: this API has no authentication and allows every CORS origin. Bind to
# 127.0.0.1, protect it with an authenticated proxy, or set http_addr: "" before
# using Mango on an untrusted network.
http_addr: ":9696"

agents:
  - name: orchestrator
    role: orchestrator
    max_tokens: 32768
    llm:
      provider: ""
      model: ""
      api_key: ""

  - name: worker
    skills: []
    max_tokens: 65536
    llm:
      provider: ""
      model: ""
      api_key: ""
